# 定义 Docker Compose 服务
services:
  # 后端 FastAPI 服务
  backend:
    # 使用项目根目录作为构建上下文
    build:
      # 指定项目根目录作为构建上下文，便于同时复制 frontend 和 backend
      context: .
      # 指定后端多阶段 Dockerfile
      dockerfile: backend/Dockerfile
    # 指定后端镜像名称
    image: outpatient-his-backend:latest
    # 指定后端容器名称
    container_name: outpatient-his-backend
    # 加载项目根目录 .env 环境变量
    env_file:
      # 引用根目录环境变量文件
      - .env
    # 覆盖容器内环境变量
    environment:
      # 将 SQLite 数据库固定到持久化目录
      DATABASE_URL: sqlite:////data/his.db
    # 挂载宿主机目录持久化数据库
    volumes:
      # 宿主机 ./data 映射到容器 /data
      - ./data:/data
    # 只在 Docker 内部网络暴露后端端口
    expose:
      # 后端容器监听 8000 端口
      - "8000"
    # 后端异常退出后自动重启
    restart: unless-stopped

  # 前端 Nginx 服务
  frontend:
    # 使用前端目录作为构建上下文
    build:
      # 指定前端构建目录
      context: ./frontend
      # 指定前端 Dockerfile
      dockerfile: Dockerfile
    # 指定前端镜像名称
    image: outpatient-his-frontend:latest
    # 指定前端容器名称
    container_name: outpatient-his-frontend
    # 将宿主机端口映射到前端容器
    ports:
      # 宿主机 8088 映射到容器 80
      - "8088:80"
    # 声明前端依赖后端服务
    depends_on:
      # 先启动 backend 服务
      - backend
    # 前端异常退出后自动重启
    restart: unless-stopped
